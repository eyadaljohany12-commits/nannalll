# Seal Plus is a native Android (Kotlin/Compose) app, not Flutter.
# APKs are produced with Gradle. There is no pubspec.yaml at the repo root
# because that file only belongs to Flutter projects.
name: Build APK
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Decode keystore if secrets are present
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        run: |
          if [ -n "${ANDROID_SIGNING_KEY}" ]; then
            echo "${ANDROID_SIGNING_KEY}" | tr -d '\n\r ' | base64 --decode > "${GITHUB_WORKSPACE}/release.jks"
            echo "HAS_KEYSTORE=true" >> "${GITHUB_ENV}"
            echo "Signing key decoded."
          else
            echo "HAS_KEYSTORE=false" >> "${GITHUB_ENV}"
            echo "No ANDROID_SIGNING_KEY secret; building an unsigned release APK."
          fi
      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_ALIAS: ${{ secrets.ANDROID_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${HAS_KEYSTORE}" = "true" ]; then
            ./gradlew assembleGenericRelease --no-daemon --stacktrace \
              -Pandroid.injected.signing.store.file="${GITHUB_WORKSPACE}/release.jks" \
              -Pandroid.injected.signing.store.password="${ANDROID_KEYSTORE_PASSWORD}" \
              -Pandroid.injected.signing.key.alias="${ANDROID_ALIAS}" \
              -Pandroid.injected.signing.key.password="${ANDROID_KEY_PASSWORD}"
          else
            ./gradlew assembleGenericRelease --no-daemon --stacktrace
          fi
      - name: List APK outputs
        run: find app/build/outputs/apk -name "*.apk" -type f -exec ls -lh {} \;
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SealPlus-APKs
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
