name: seal
description: "A Android application for downloading video/audio from various platforms, powered by yt-dlp."
publish_to: "none"
version: 1.11.2+127

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # UI & Material Design
  dynamic_color: ^1.7.0
  material_color_utilities: ^0.8.0
  flutter_svg: ^2.0.9
  animations: ^2.0.8
  url_launcher: ^6.2.2
  share_plus: ^7.2.1
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  
  # State Management & Utilities
  provider: ^6.1.1
  intl: ^0.19.0
  package_info_plus: ^5.0.1
  permission_handler: ^11.1.0
  dio: ^5.4.0
  path: ^1.8.3
  archive: ^3.4.10
  
  # Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icon/
